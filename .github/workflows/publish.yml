name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # Creates the draft release up front so each build job can upload its own
  # assets straight to it, instead of round-tripping hundreds of MB through
  # artifact storage. Always runs (a skipped job would skip its dependents);
  # the step inside is what is tag-gated.
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release if missing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-running a published tag would rebuild archives with new hashes and
            # break every package manifest that already recorded the old ones.
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; refusing to replace its assets. Cut a new tag instead."
              exit 1
            fi
            echo "Draft release $TAG already exists; assets will be added to it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "$TAG"
          fi

  build:
    name: Build and Publish (${{ matrix.platform }})
    needs: [prepare-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      # glibc 2.28 build image: Linux binaries then need only GLIBC_2.17. Multi-arch digest.
      AOT_LINUX_IMAGE: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b

    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: win-x64
            os: windows-latest
          - platform: win-x86
            os: windows-latest
          - platform: osx-x64
            os: macos-15-intel
          - platform: osx-arm64
            os: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer derives the version from tags and history

      - name: Setup .NET SDK
        if: runner.os != 'Linux'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (${{ matrix.platform }})
        if: runner.os != 'Linux'
        shell: bash
        run: |
          dotnet publish hyperdu.Cli/hyperdu.Cli.csproj \
            -c Release \
            -r ${{ matrix.platform }} \
            -p:PublishAot=true \
            -o publish/${{ matrix.platform }}

      - name: Publish (${{ matrix.platform }}, glibc 2.28 container)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e CI -e GITHUB_REF_TYPE -e GITHUB_REF_NAME \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/src \
            "$AOT_LINUX_IMAGE" \
            bash .github/scripts/publish-linux-aot.sh ${{ matrix.platform }} publish/${{ matrix.platform }}

      - name: Check Linux Binary (glibc floor, no ICU)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="publish/${{ matrix.platform }}/hyperdu"
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Max glibc symbol: $max"
          if [ "$(printf '%s\n' "$max" GLIBC_2.28 | sort -V | tail -n1)" != "GLIBC_2.28" ]; then
            echo "::error::$bin requires $max (newer than GLIBC_2.28)"; exit 1
          fi
          if grep -qa libicu "$bin"; then
            echo "::error::$bin references libicu (is InvariantGlobalization off?)"; exit 1
          fi

      - name: Smoke Test
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "$PLATFORM" == win-* ]]; then ext=".exe"; fi
          "publish/$PLATFORM/hyperdu$ext" --version

      # Archives hold only what users run; debug symbols go to a separate CI artifact.
      - name: Package Archive (Windows)
        if: ${{ startsWith(matrix.platform, 'win-') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "stage/hyperdu-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "publish/${{ matrix.platform }}/hyperdu.exe", LICENSE, README.md -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath hyperdu-${{ matrix.platform }}.zip

      - name: Package Archive (Non-Windows)
        if: ${{ !startsWith(matrix.platform, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/package-unix-archive.sh \
            "publish/${{ matrix.platform }}/hyperdu" \
            "hyperdu-${{ matrix.platform }}.tar.gz" \
            LICENSE \
            README.md

      - name: Verify Unix Release Archive
        if: ${{ !startsWith(matrix.platform, 'win-') }}
        shell: bash
        run: |
          set -euo pipefail
          tmp_verify="$(mktemp -d "${TMPDIR:-/tmp}/hyperdu-verify.XXXXXX")"
          trap 'rm -rf "$tmp_verify"' EXIT
          bash .github/scripts/verify-unix-archive.sh \
            "hyperdu-${{ matrix.platform }}.tar.gz" \
            --extract-dir "$tmp_verify/bin"
          if [ "${{ runner.os }}" = "Linux" ]; then
            python3 .github/scripts/check-aot-startup.py \
              --binary "$tmp_verify/bin/du" \
              --target README.md \
              --max-median-ms 5.0
            bash tests/compat/diff-run.sh \
              --candidate-du "$tmp_verify/bin/du" \
              --min-score 100
          fi

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: hyperdu-symbols-${{ matrix.platform }}
          path: |
            publish/${{ matrix.platform }}/*.dbg
            publish/${{ matrix.platform }}/*.pdb
            publish/${{ matrix.platform }}/*.dSYM
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Release Assets (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
            echo "::error::$TAG is already published; refusing to replace its assets."; exit 1
          fi
          found=()
          for f in "hyperdu-${{ matrix.platform }}.zip" "hyperdu-${{ matrix.platform }}.tar.gz"; do
            [ -f "$f" ] && found+=("$f")
          done
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::No package produced for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "$TAG" "${found[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload CI Artifact (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdu-${{ matrix.platform }}
          path: |
            hyperdu-${{ matrix.platform }}.zip
            hyperdu-${{ matrix.platform }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  pack-tool:
    name: Pack Dotnet Tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # MinVer derives the version from tags and history

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack Tool
        run: dotnet pack hyperdu.Cli/hyperdu.Cli.csproj -c Release -o publish/tool

      - name: Upload Tool Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperdu-tool
          path: publish/tool/*.nupkg
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pack-tool]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      # Only the nupkg still travels through artifact storage; the platform
      # binaries are already attached to the draft release by the build jobs.
      - name: Download Tool Package
        uses: actions/download-artifact@v4
        with:
          name: hyperdu-tool
          path: artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: 'jav26122'

      - name: Publish to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Add GitHub NuGet Source
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Attach Tool Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
            echo "::error::$TAG is already published; refusing to replace its assets."; exit 1
          fi
          gh release upload "$TAG" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber

      # Package managers (Homebrew, Scoop, AUR, Nix) read hashes from this file.
      - name: Generate and Attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" != "true" ]; then
            echo "::error::$TAG is already published; refusing to replace its assets."; exit 1
          fi
          rm -rf release-assets && mkdir release-assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          rm -f release-assets/SHA256SUMS
          (cd release-assets && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          {
            echo "### Published $TAG"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"

  # Package-manager submission is a nice-to-have. In its own non-blocking job,
  # a broken or renamed action can no longer stop the release assets from being
  # published - which is exactly how v1.1.1 shipped with zero assets.
  #
  # Calls a pinned Komac directly instead of winget-releaser@v2, which installs
  # whatever Komac is latest. Komac >= 2.17 rebuilds NestedInstallerFiles from the
  # zip and drops PortableCommandAlias, so the manifest is checked and the alias
  # re-applied before submitting. Prerelease tags are skipped: a WinGet version
  # string can never be reused.
  winget:
    name: Update WinGet Package
    runs-on: ubuntu-24.04  # yq is preinstalled
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    continue-on-error: true
    env:
      KOMAC_VERSION: '2.17.2'
      KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
      PACKAGE_ID: JaretVarn.hyperdu
      KOMAC_FORK_OWNER: ${{ github.repository_owner }}
    steps:
      - name: Install Komac
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          gh release download "v${KOMAC_VERSION}" --repo russellbanks/Komac \
            --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "${KOMAC_SHA256}  ${RUNNER_TEMP}/${asset}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/komac"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/komac"
          bin="$(find "$RUNNER_TEMP/komac" -type f -name komac -print -quit)"
          test -n "$bin"
          chmod +x "$bin"
          dirname "$bin" >> "$GITHUB_PATH"

      - name: Generate and Check Manifests
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          komac --version
          VERSION="${GITHUB_REF_NAME#v}"

          # Komac's own existing-PR check also matches closed/merged PRs, which would block
          # resubmitting a rejected version forever. Only an open PR should stop us.
          open_prs="$(gh pr list --repo microsoft/winget-pkgs --state open \
            --search "$PACKAGE_ID $VERSION in:title" --json number --jq length)"
          if [ "$open_prs" != 0 ]; then
            echo "::error::An open microsoft/winget-pkgs PR for $PACKAGE_ID $VERSION already exists."
            exit 1
          fi

          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          urls=("$base/hyperdu-win-x64.zip" "$base/hyperdu-win-x86.zip")
          for u in "${urls[@]}"; do curl -fsSIL -o /dev/null "$u"; done

          out="$RUNNER_TEMP/winget"
          komac update "$PACKAGE_ID" --version "$VERSION" --urls "${urls[@]}" --output "$out" --exit --skip-pr-check
          f="$(find "$out" -type f -name "$PACKAGE_ID.installer.yaml" -print -quit)"
          if [ -z "$f" ]; then
            echo "::error::Komac wrote no installer manifest for $VERSION"
            exit 1
          fi
          cat "$f"

          # A root RelativeFilePath of hyperdu.exe proves Komac detected the exe in BOTH zips;
          # on a detection miss the stale hyperdu.Cli.exe from 0.1.5 would survive at the root.
          test "$(yq '.NestedInstallerType' "$f")" = portable
          test "$(yq '.NestedInstallerFiles | length' "$f")" = 1
          test "$(yq '.NestedInstallerFiles[0].RelativeFilePath' "$f")" = hyperdu.exe
          test "$(yq '[.Installers[].Architecture] | sort | join(",")' "$f")" = x64,x86
          if grep -q 'hyperdu.Cli' "$f"; then echo "::error::stale hyperdu.Cli reference"; exit 1; fi

          curl -fsSL "$base/SHA256SUMS" -o "$RUNNER_TEMP/SHA256SUMS"
          for a in x64 x86; do
            want="$(grep " hyperdu-win-$a.zip\$" "$RUNNER_TEMP/SHA256SUMS" | cut -d' ' -f1 | tr a-f A-F)"
            got="$(yq ".Installers[] | select(.Architecture == \"$a\") | .InstallerSha256" "$f")"
            test -n "$want"
            test "$want" = "$got"
          done

          yq -i '.NestedInstallerFiles[0].PortableCommandAlias = "hyperdu"' "$f"
          cat "$f"
          echo "MANIFEST_DIR=$(dirname "$f")" >> "$GITHUB_ENV"

      - name: Submit to microsoft/winget-pkgs
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          komac sync-fork
          komac submit "$MANIFEST_DIR" --yes
          komac cleanup --only-merged || true
