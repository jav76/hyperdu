name: Build and Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  # Creates the draft release up front so each build job can upload its own
  # assets straight to it, instead of round-tripping hundreds of MB through
  # artifact storage. Always runs (a skipped job would skip its dependents);
  # the step inside is what is tag-gated.
  prepare-release:
    name: Prepare Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release if missing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; assets will be added to it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --generate-notes --title "$TAG"
          fi

  build:
    name: Build and Publish (${{ matrix.platform }})
    needs: [prepare-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: win-x64
            os: windows-latest
          - platform: win-x86
            os: windows-latest
          - platform: osx-x64
            os: macos-15-intel
          - platform: osx-arm64
            os: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT Build Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Parse Version
        id: versioning
        shell: bash
        run: |
          BASE_VERSION="1.0.0"
          if [ -f Directory.Build.props ]; then
            PROP_VERSION=$(grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' Directory.Build.props | head -n 1)
            if [ -n "$PROP_VERSION" ]; then
              BASE_VERSION="$PROP_VERSION"
            fi
          fi
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG_NAME="${{ github.ref_name }}"
            SEM_VER="${TAG_NAME#v}"
            echo "version_prefix=${SEM_VER}" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
          else
            echo "version_prefix=${BASE_VERSION}" >> $GITHUB_OUTPUT
            echo "version_suffix=ci.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish Profile (${{ matrix.platform }})
        shell: bash
        run: |
          dotnet publish hyperdu.Cli/hyperdu.Cli.csproj \
            -c Release \
            -r ${{ matrix.platform }} \
            -p:PublishAot=true \
            -p:VersionPrefix="${{ steps.versioning.outputs.version_prefix }}" \
            -p:VersionSuffix="${{ steps.versioning.outputs.version_suffix }}" \
            -p:FileVersion="${{ steps.versioning.outputs.version_prefix }}.${{ github.run_number }}" \
            -p:InformationalVersion="${{ steps.versioning.outputs.version_prefix }}${{ steps.versioning.outputs.version_suffix != '' && format('-{0}', steps.versioning.outputs.version_suffix) || '' }}+sha.${{ github.sha }}" \
            -o publish/${{ matrix.platform }}

      - name: Compress Executables (Windows)
        if: ${{ startsWith(matrix.platform, 'win-') }}
        shell: pwsh
        run: |
          Compress-Archive -Path publish/${{ matrix.platform }}/* -DestinationPath hyperdu-${{ matrix.platform }}.zip

      - name: Compress Executables (Non-Windows)
        if: ${{ !startsWith(matrix.platform, 'win-') }}
        shell: bash
        run: |
          cd publish/${{ matrix.platform }}
          tar -czf ../../hyperdu-${{ matrix.platform }}.tar.gz *

      - name: Upload Release Assets (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          found=()
          for f in "hyperdu-${{ matrix.platform }}.zip" "hyperdu-${{ matrix.platform }}.tar.gz"; do
            [ -f "$f" ] && found+=("$f")
          done
          if [ ${#found[@]} -eq 0 ]; then
            echo "::error::No package produced for ${{ matrix.platform }}"
            exit 1
          fi
          gh release upload "$TAG" "${found[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload CI Artifact (non-tag builds)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperdu-${{ matrix.platform }}
          path: |
            hyperdu-${{ matrix.platform }}.zip
            hyperdu-${{ matrix.platform }}.tar.gz
          retention-days: 7
          if-no-files-found: error

  pack-tool:
    name: Pack Dotnet Tool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Parse Version
        id: versioning
        shell: bash
        run: |
          BASE_VERSION="1.0.0"
          if [ -f Directory.Build.props ]; then
            PROP_VERSION=$(grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+' Directory.Build.props | head -n 1)
            if [ -n "$PROP_VERSION" ]; then
              BASE_VERSION="$PROP_VERSION"
            fi
          fi
          
          if [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG_NAME="${{ github.ref_name }}"
            SEM_VER="${TAG_NAME#v}"
            echo "version_prefix=${SEM_VER}" >> $GITHUB_OUTPUT
            echo "version_suffix=" >> $GITHUB_OUTPUT
          else
            echo "version_prefix=${BASE_VERSION}" >> $GITHUB_OUTPUT
            echo "version_suffix=ci.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Pack Tool
        run: |
          dotnet pack hyperdu.Cli/hyperdu.Cli.csproj \
            -c Release \
            -p:VersionPrefix="${{ steps.versioning.outputs.version_prefix }}" \
            -p:VersionSuffix="${{ steps.versioning.outputs.version_suffix }}" \
            -p:FileVersion="${{ steps.versioning.outputs.version_prefix }}.${{ github.run_number }}" \
            -p:InformationalVersion="${{ steps.versioning.outputs.version_prefix }}${{ steps.versioning.outputs.version_suffix != '' && format('-{0}', steps.versioning.outputs.version_suffix) || '' }}+sha.${{ github.sha }}" \
            -o publish/tool

      - name: Upload Tool Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hyperdu-tool
          path: publish/tool/*.nupkg
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, pack-tool]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      # Only the nupkg still travels through artifact storage; the platform
      # binaries are already attached to the draft release by the build jobs.
      - name: Download Tool Package
        uses: actions/download-artifact@v4
        with:
          name: hyperdu-tool
          path: artifacts

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: 'jav26122'

      - name: Publish to NuGet
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Add GitHub NuGet Source
        run: |
          dotnet nuget add source --username ${{ github.repository_owner }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      - name: Attach Tool Package and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" artifacts/*.nupkg --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          {
            echo "### Published $TAG"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'
          } >> "$GITHUB_STEP_SUMMARY"

  # Package-manager submission is a nice-to-have. In its own non-blocking job,
  # a broken or renamed action can no longer stop the release assets from being
  # published - which is exactly how v1.1.1 shipped with zero assets.
  winget:
    name: Update WinGet Package
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    steps:
      - name: Update WinGet Package
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: JaretVarn.hyperdu
          release-tag: ${{ github.ref_name }}
          installers-regex: 'hyperdu-win-(x64|x86)\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}
