name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark corpus scale (quick, standard, full)"
        required: false
        default: "standard"
        type: choice
        options:
          - quick
          - standard
          - full
  push:
    branches:
      - main
  pull_request:
    paths:
      - "hyperdu.Core/**"
      - "hyperdu.Cli/**"
      - "hyperdu.Benchmarks/**"
      - "tests/bench/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark (${{ inputs.suite || 'standard' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install benchmark tools (hyperfine, GNU time, clang)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends hyperfine time clang zlib1g-dev
          sudo apt-get install -y -qq --no-install-recommends ncdu || true

      - name: Record reference du version
        run: du --version | head -n 1

      - name: Run CLI benchmarks
        run: |
          SUITE="${{ inputs.suite || 'standard' }}"
          bash tests/bench/run-bench.sh --suite "$SUITE" --output-dir artifacts/benchmarks

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f artifacts/benchmarks/report.md ]; then
            cat artifacts/benchmarks/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ inputs.suite || 'standard' }}
          path: artifacts/benchmarks/
          if-no-files-found: warn
