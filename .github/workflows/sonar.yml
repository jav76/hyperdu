name: SonarQube Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  security-events: write

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # Ephemeral Tailscale ingress to internal SonarQube (sonarqube.local.jav26122.net).
      # Prerequisites: Tailscale ACL tag `tag:ci`, OAuth secrets `TS_OAUTH_CLIENT_ID` /
      # `TS_OAUTH_SECRET`, subnet router + split-DNS, and `SONAR_HOST_URL=https://sonarqube.local.jav26122.net`.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      # Scanner-side multicriteria replaces any list set in the SonarQube UI; add new exclusions here as e5, e6, ...
      # S6640 (unsafe blocks) is ignored on intentional native syscall / IOKit FFI / pointer-arena files.
      - name: Build, test with coverage, and analyze
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
            /k:"jav76_hyperdu_205c3499-2670-4991-8a9a-29c5f76e3d9f" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/**/*.xml" \
            /d:sonar.issue.ignore.multicriteria=e1,e2,e3,e4 \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S6640 \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="**/hyperdu.Core/Native/**" \
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey=csharpsquid:S6640 \
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/hyperdu.Core/Du/**" \
            /d:sonar.issue.ignore.multicriteria.e3.ruleKey=csharpsquid:S6640 \
            /d:sonar.issue.ignore.multicriteria.e3.resourceKey="**/hyperdu.Core/Scanning/DiskDeviceHelper.cs" \
            /d:sonar.issue.ignore.multicriteria.e4.ruleKey=csharpsquid:S6640 \
            /d:sonar.issue.ignore.multicriteria.e4.resourceKey="**/hyperdu.Tests/**"
          dotnet build hyperdu.slnx -c Release
          dotnet test hyperdu.slnx -c Release --no-build --collect:"Code Coverage;Format=Xml" --results-directory TestResults
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Export SonarQube results to SARIF, Pages bundle, and step summary
        env:
          SONAR_BADGE_TOKEN: ${{ secrets.SONAR_BADGE_TOKEN }}
        run: |
          python3 .github/scripts/sonar_export.py \
            --host-url "${{ secrets.SONAR_HOST_URL }}" \
            --token "${{ secrets.SONAR_TOKEN }}" \
            --sarif-out sonar-results.sarif \
            --pages-dir gh-pages-out \
            --summary-out sonar-summary.md \
            --repo-url "${{ github.server_url }}/${{ github.repository }}"
          if [ -f sonar-summary.md ]; then
            cat sonar-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SonarQube artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: |
            sonar-results.sarif
            gh-pages-out/
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sonar-results.sarif
          category: sonarqube

      - name: Publish static report and badges to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages-out
